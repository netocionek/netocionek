<title>Casa Bonifácio e Alana 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: 3D canvas full-bleed; small floating panels on the edges (single warm-dark look over a daylight scene) */
:root{
  --panel: rgba(34,29,24,.86);
  --panel-hi: rgba(58,49,40,.92);
  --ink:#f5efe5;
  --muted:#cbbfae;
  --accent:#b5d99b;
  --accent-ink:#1c2a12;
  --line:rgba(255,255,255,.14);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#cfe2ee;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);max-width:min(340px,calc(100vw - 230px));padding:10px 14px;display:flex;flex-direction:column;gap:4px}
#top h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
#room{font-size:20px;font-weight:700;color:var(--accent);line-height:1.15}
#roomInfo{font-size:12.5px;color:var(--muted);line-height:1.35}
#help{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
#mapWrap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);padding:8px}
#map{display:block;width:198px;height:90px;cursor:crosshair}
#mapCap{font-size:10.5px;color:var(--muted);margin-top:4px;text-align:center}
#bar{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding:2px}
.row::-webkit-scrollbar{display:none}
.lab{flex:none;align-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#2a241d;background:rgba(255,255,255,.72);padding:4px 8px;border-radius:999px;font-weight:700}
button.chip{flex:none;font:600 13px var(--font);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;white-space:nowrap}
button.chip:hover{background:var(--panel-hi)}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
button.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 120px);width:118px;height:118px;border-radius:50%;background:rgba(34,29,24,.45);border:1px solid var(--line);touch-action:none}
#knob{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:var(--accent);opacity:.9}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:15px;color:#2a241d}
#loading[hidden]{display:none}
@media (max-width:560px){#top{max-width:calc(100vw - 24px);top:calc(env(safe-area-inset-top,0px) + 112px)}#help{display:none}#room{font-size:17px}}
</style>

<canvas id="c" tabindex="0" aria-label="Passeio 3D pela casa"></canvas>
<div id="loading">Carregando a casa…</div>

<div id="top" class="panel">
  <h1>Casa Bonifácio e Alana · estudo v15</h1>
  <div id="room">Varanda</div>
  <div id="roomInfo"></div>
  <div id="help">Arraste para olhar · W A S D ou setas para andar (Shift corre) · toque no mapa para ir até lá</div>
</div>

<div id="mapWrap" class="panel">
  <canvas id="map" width="396" height="180" aria-label="Mapa da planta"></canvas>
  <div id="mapCap">planta · norte para cima · rua à direita</div>
</div>

<div id="joy" hidden><div id="knob"></div></div>

<div id="bar">
  <div class="row" id="views"><span class="lab">Ir para</span></div>
  <div class="row" id="opts"><span class="lab">Sol</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('loading').textContent='Não foi possível carregar o 3D. Recarregue a página.';return;}
const T=THREE;
const canvas=document.getElementById('c');
const renderer=new T.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
scene.background=new T.Color(0xbcd9ec);
scene.fog=new T.Fog(0xbcd9ec,45,110);
const camera=new T.PerspectiveCamera(72,1,0.05,300);
camera.rotation.order='YXZ';

// ---------- house geometry (plan: x west→east 0..22, z north→south 0..10; meters) ----------
const hr=z=>4.45-0.30*(10-z);              // shed roof (quartos + sala), rising to the south wall
const hb=z=>hr(4.5)-0.15*(4.5-z);          // varanda, 15%
const g=z=>2.75+0.30*(2.7-Math.abs(z-5.2)); // cozinha gable, ridge E-W
const FL=0.15;

// ---------- textures ----------
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.encoding=T.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const tTile=tex(256,256,(x,w,h)=>{const rows=3,cols=6;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const x0=c*w/cols,y0=r*h/rows,ww=w/cols,hh=h/rows;const v=rnd()*24;const gr=x.createLinearGradient(x0,0,x0+ww,0);gr.addColorStop(0,`rgb(${120+v},${52+v/3},${34})`);gr.addColorStop(.5,`rgb(${178+v},${84+v/2},${52})`);gr.addColorStop(1,`rgb(${118+v},${50+v/3},${32})`);x.fillStyle=gr;x.fillRect(x0,y0,ww,hh);x.fillStyle='rgba(40,15,5,.35)';x.fillRect(x0,y0+hh-5,ww,5);}});
const tWood=tex(256,256,(x,w,h)=>{const n=7;for(let i=0;i<n;i++){const v=rnd()*30;x.fillStyle=`rgb(${150+v},${104+v*.7},${66+v*.4})`;x.fillRect(0,i*h/n,w,h/n);for(let k=0;k<40;k++){x.fillStyle=`rgba(80,45,20,${rnd()*.12})`;x.fillRect(rnd()*w,i*h/n+rnd()*h/n,rnd()*60+20,1);}x.fillStyle='rgba(60,35,15,.5)';x.fillRect(0,i*h/n,w,1.5);x.fillRect(rnd()*w,i*h/n,1.5,h/n);}});
const tLambri=tex(256,256,(x,w,h)=>{const n=10;for(let i=0;i<n;i++){const v=rnd()*20;x.fillStyle=`rgb(${196+v},${160+v},${118+v*.6})`;x.fillRect(i*w/n,0,w/n,h);x.fillStyle='rgba(90,60,30,.35)';x.fillRect(i*w/n,0,1.5,h);for(let k=0;k<25;k++){x.fillStyle=`rgba(120,80,40,${rnd()*.15})`;x.fillRect(i*w/n+rnd()*w/n,rnd()*h,1,rnd()*50+10);}}});
const tGrass=tex(256,256,(x,w,h)=>{x.fillStyle='#6f9a4b';x.fillRect(0,0,w,h);for(let i=0;i<3500;i++){const v=rnd();x.fillStyle=v<.5?`rgba(60,100,35,.5)`:`rgba(150,190,95,.45)`;x.fillRect(rnd()*w,rnd()*h,1.5,3);}});
const tConc=tex(256,256,(x,w,h)=>{x.fillStyle='#b9b3a8';x.fillRect(0,0,w,h);for(let i=0;i<2500;i++){x.fillStyle=`rgba(${rnd()<.5?80:255},${rnd()<.5?80:255},${rnd()<.5?80:255},.06)`;x.fillRect(rnd()*w,rnd()*h,2,2);}x.strokeStyle='rgba(70,65,60,.35)';x.strokeRect(0,0,w,h);});
const tCim=tex(256,256,(x,w,h)=>{x.fillStyle='#a8a196';x.fillRect(0,0,w,h);for(let i=0;i<60;i++){const r=rnd()*50+10;const gr=x.createRadialGradient(0,0,0,0,0,r);gr.addColorStop(0,`rgba(${rnd()<.5?90:200},${rnd()<.5?85:190},80,.12)`);gr.addColorStop(1,'rgba(0,0,0,0)');x.save();x.translate(rnd()*w,rnd()*h);x.fillStyle=gr;x.fillRect(-r,-r,2*r,2*r);x.restore();}});
const tCer=tex(256,256,(x,w,h)=>{x.fillStyle='#ddd6ca';x.fillRect(0,0,w,h);x.strokeStyle='rgba(120,110,100,.55)';x.lineWidth=2;for(let i=0;i<=2;i++){x.beginPath();x.moveTo(i*w/2,0);x.lineTo(i*w/2,h);x.stroke();x.beginPath();x.moveTo(0,i*h/2);x.lineTo(w,i*h/2);x.stroke();}});
const tBrick=tex(256,128,(x,w,h)=>{x.fillStyle='#e8d8c8';x.fillRect(0,0,w,h);const bw=w/4,bh=h/8;for(let r=0;r<8;r++)for(let c=-1;c<5;c++){const v=rnd()*30;x.fillStyle=`rgb(${176+v},${92+v/2},${62})`;x.fillRect(c*bw+(r%2?bw/2:0)+1.5,r*bh+1.5,bw-3,bh-3);}});
const tAsph=tex(256,256,(x,w,h)=>{x.fillStyle='#55575a';x.fillRect(0,0,w,h);for(let i=0;i<3000;i++){x.fillStyle=`rgba(255,255,255,${rnd()*.06})`;x.fillRect(rnd()*w,rnd()*h,1.5,1.5);}});

const M=(o)=>new T.MeshStandardMaterial(Object.assign({roughness:.9,metalness:0},o));
const mat={
  wall:M({color:0xf2ece2}), wallExt:M({color:0xefe6d8}), cega:M({color:0xe9e0d2}),
  frame:M({color:0x6e4a2c,roughness:.7}), wood:M({color:0x8b5e38,roughness:.7}), woodLight:M({color:0xb98a5a,roughness:.75}),
  tile:M({map:tTile,roughness:.8,side:T.DoubleSide}), ceil:M({map:tLambri,roughness:.85,side:T.DoubleSide}),
  floorWood:M({map:tWood,roughness:.7}), cer:M({map:tCer,roughness:.5}), cim:M({map:tCim,roughness:.6}),
  grass:M({map:tGrass}), conc:M({map:tConc}), asph:M({map:tAsph}), brick:M({map:tBrick}),
  glass:new T.MeshStandardMaterial({color:0xcfe6f2,transparent:true,opacity:.16,roughness:.05,metalness:.1,depthWrite:false,side:T.DoubleSide}),
  muro:M({color:0xd8cfbf}), fabric:M({color:0x8fa883}), linen:M({color:0xebe3d4}), terra:M({color:0xc0704a}),
  white:M({color:0xf7f5f0,roughness:.4}), steel:M({color:0xb8bcbf,roughness:.35,metalness:.6}), dark:M({color:0x2f2c2a,roughness:.5}),
  leaf:M({color:0x6f9f4a,flatShading:true}), leaf2:M({color:0x88b85a,flatShading:true}), trunk:M({color:0x6b4a2b}),
  neighbor:M({color:0xe4ddd0}), nroof:M({color:0x9a8f84}), rug:M({color:0xc9b48f})
};

const world=new T.Group();scene.add(world);
const roofG=new T.Group();world.add(roofG);
const e2G=new T.Group();world.add(e2G);
const colliders=[]; // {x0,z0,x1,z1,grp}

function quad(p,uv,m,parent=world,cast=true){const g2=new T.BufferGeometry();g2.setAttribute('position',new T.Float32BufferAttribute([].concat(...p),3));g2.setAttribute('uv',new T.Float32BufferAttribute([].concat(...uv),2));g2.setIndex([0,2,1,0,3,2]);g2.computeVertexNormals();const me=new T.Mesh(g2,m);me.receiveShadow=true;me.castShadow=cast;parent.add(me);return me;}
function floor(x0,z0,x1,z1,y,m,parent=world){return quad([[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],[[x0,z0],[x1,z0],[x1,z1],[x0,z1]],m,parent,false);}
function box(w,h,d,x,y,z,m,parent=world,cast=true){const me=new T.Mesh(new T.BoxGeometry(w,h,d),m);me.position.set(x,y+h/2,z);me.castShadow=cast;me.receiveShadow=true;parent.add(me);return me;}
function cyl(r,h,x,y,z,m,parent=world,seg=20){const me=new T.Mesh(new T.CylinderGeometry(r,r,h,seg),m);me.position.set(x,y+h/2,z);me.castShadow=true;me.receiveShadow=true;parent.add(me);return me;}

// wall with openings: holes {a,b,y0,y1,kind:'door'|'glass'|'win'|'open'|'slide', side:±1, pass}
function wall(x1,z1,x2,z2,top,holes=[],opt={}){
  const t=opt.t||0.15,m=opt.m||mat.wall,parent=opt.parent||world,e=t/2;
  const dx=x2-x1,dz=z2-z1,L0=Math.hypot(dx,dz),c=dx/L0,s=dz/L0;
  const sx=x1-c*e,sz=z1-s*e,L=L0+t;
  const sh=new T.Shape();sh.moveTo(0,0);sh.lineTo(L,0);
  const N=Math.max(2,Math.ceil(L/0.2));
  for(let i=N;i>=0;i--){const u=L*i/N;sh.lineTo(u,top(sx+c*u,sz+s*u));}
  holes.forEach(h=>{const p=new T.Path();const a=h.a+e,b=h.b+e;p.moveTo(a,h.y0);p.lineTo(b,h.y0);p.lineTo(b,h.y1);p.lineTo(a,h.y1);p.lineTo(a,h.y0);sh.holes.push(p);});
  const geo=new T.ExtrudeGeometry(sh,{depth:t,bevelEnabled:false});geo.translate(0,0,-t/2);
  const me=new T.Mesh(geo,m);me.position.set(sx,0,sz);me.rotation.y=-Math.atan2(dz,dx);me.castShadow=true;me.receiveShadow=true;parent.add(me);
  const P=u=>[x1+c*u,z1+s*u], nx=-s,nz=c, ang=-Math.atan2(dz,dx);
  holes.forEach(h=>{
    const w=h.b-h.a,mid=(h.a+h.b)/2,[mx,mz]=P(mid);
    if(h.kind==='glass'||h.kind==='win'){ // framed glass (fixed)
      const pane=new T.Mesh(new T.BoxGeometry(w,h.y1-h.y0,0.02),mat.glass);pane.position.set(mx,(h.y0+h.y1)/2,mz);pane.rotation.y=ang;parent.add(pane);
      frame(h,P,ang,parent,w);
      if(h.transom){const tb=new T.Mesh(new T.BoxGeometry(w,0.06,0.1),mat.frame);tb.position.set(mx,h.transom,mz);tb.rotation.y=ang;parent.add(tb);}
      if(h.mull){const mb=new T.Mesh(new T.BoxGeometry(0.05,h.y1-h.y0,0.1),mat.frame);mb.position.set(mx,(h.y0+h.y1)/2,mz);mb.rotation.y=ang;parent.add(mb);}
    }
    if(h.kind==='slide'){ // open sliding glass: panes parked at both ends
      const pw=Math.min(0.62,w/4);[[h.a+pw/2],[h.b-pw/2]].forEach(([u])=>{const [px,pz]=P(u);const pane=new T.Mesh(new T.BoxGeometry(pw,h.y1-h.y0,0.02),mat.glass);pane.position.set(px,(h.y0+h.y1)/2,pz);pane.rotation.y=ang;parent.add(pane);});
      frame(h,P,ang,parent,w);
    }
    if(h.kind==='door'){ // open leaf
      const side=h.side||1,[hx,hz]=P(h.a);const leaf=new T.Mesh(new T.BoxGeometry(0.04,h.y1-h.y0-0.02,w-0.04),opt.leafMat||mat.woodLight);
      leaf.position.set(hx+nx*side*(w/2),(h.y0+h.y1)/2,hz+nz*side*(w/2));leaf.rotation.y=ang;leaf.castShadow=true;parent.add(leaf);
      frame(h,P,ang,parent,w);
    }
    if(h.kind==='pocket'){ // sliding wooden door, open
      const [px,pz]=P(h.b+w/2-0.05);const leaf=new T.Mesh(new T.BoxGeometry(w,h.y1-h.y0-0.02,0.04),mat.woodLight);leaf.position.set(px+nx*0.12,(h.y0+h.y1)/2,pz+nz*0.12);leaf.rotation.y=ang;parent.add(leaf);
    }
  });
  // colliders (axis-aligned)
  const solid=[];let cur=0;const ph=holes.filter(h=>h.y0<0.35&&h.y1>1.9&&(h.kind==='door'||h.kind==='slide'||h.kind==='open'||h.kind==='pocket')).map(h=>[h.a,h.b]).sort((p,q)=>p[0]-q[0]);
  ph.forEach(([a,b])=>{if(a>cur)solid.push([cur-e,a]);cur=b;});if(cur<L0)solid.push([cur,L0+e]);
  solid.forEach(([a,b])=>{const [ax,az]=P(a),[bx,bz]=P(b);colliders.push({x0:Math.min(ax,bx)-(Math.abs(s)>.5?e:0),x1:Math.max(ax,bx)+(Math.abs(s)>.5?e:0),z0:Math.min(az,bz)-(Math.abs(c)>.5?e:0),z1:Math.max(az,bz)+(Math.abs(c)>.5?e:0),grp:parent});});
  return me;
}
function frame(h,P,ang,parent,w){const fw=0.06,d=0.17;[[h.a+fw/2,(h.y0+h.y1)/2,fw,h.y1-h.y0],[h.b-fw/2,(h.y0+h.y1)/2,fw,h.y1-h.y0],[(h.a+h.b)/2,h.y1-fw/2,w,fw]].forEach(([u,y,ww,hh])=>{const [px,pz]=P(u);const f=new T.Mesh(new T.BoxGeometry(ww,hh,d),mat.frame);f.position.set(px,y,pz);f.rotation.y=ang;parent.add(f);});if(h.y0>0.3){const [px,pz]=P((h.a+h.b)/2);const f=new T.Mesh(new T.BoxGeometry(w+.04,0.04,d+.04),mat.frame);f.position.set(px,h.y0,pz);f.rotation.y=ang;parent.add(f);}}

const C=v=>()=>v;
const DOOR=(a,b,side)=>({a,b,y0:FL,y1:2.25,kind:'door',side});
const PJ=(a,b)=>({a,b,y0:FL,y1:2.8,kind:'glass',transom:2.37,mull:true});

// ---- floors ----
floor(3.3,5,6.4,8.9,FL,mat.floorWood);floor(8,5,10.9,8.9,FL,mat.floorWood);floor(3.3,8.9,10.9,10,FL,mat.floorWood);
floor(10.9,4.5,14.2,10,FL,mat.floorWood);
floor(6.4,5,8,8.9,FL,mat.cer);floor(14.2,2.5,17,7.9,FL,mat.cer);
floor(10.9,2.3,14.2,4.5,0.12,mat.cim);
floor(0.5,5,3.3,10,FL,mat.floorWood,e2G);

// ---- walls ----
const hrT=(x,z)=>hr(z), gT=(x,z)=>g(z);
wall(3.3,10,14.2,10,hrT,[],{m:mat.cega,t:0.19});                                   // parede sul cega na divisa
wall(3.3,5,10.9,5,hrT,[PJ(0.55,2.55),{a:3.6,b:4.2,y0:1.6,y1:2.1,kind:'win'},PJ(5.25,7.05)],{m:mat.wallExt}); // fachada norte quartos
wall(10.9,4.5,14.2,4.5,hrT,[{a:0.4,b:2.9,y0:FL,y1:2.35,kind:'slide'}],{m:mat.wallExt});    // sala → varanda
wall(3.3,5,3.3,10,hrT,[{a:3.95,b:4.95,y0:FL,y1:2.25,kind:'open'}],{m:mat.wallExt});    // oeste (Etapa 1), vão para o 2º quarto
wall(10.9,4.5,10.9,8.9,hrT);                                                            // quarto | sala
wall(6.4,5,6.4,8.9,hrT,[{a:0.3,b:1.0,y0:FL,y1:2.25,kind:'door',side:1}]);
wall(8,5,8,8.9,hrT);
wall(6.4,6.9,8,6.9,hrT);
wall(3.3,8.9,10.9,8.9,hrT,[DOOR(2.35,3.05,-1),DOOR(3.3,4.0,-1),DOOR(4.9,5.7,-1)]);
// bloco cozinha
wall(14.2,2.5,17,2.5,(x,z)=>2.75,[{a:0.8,b:2.2,y0:1.1,y1:2.2,kind:'win',mull:true}],{m:mat.wallExt});
wall(17,2.5,17,7.9,gT,[{a:0.6,b:2.1,y0:1.1,y1:2.2,kind:'win',mull:true},{a:3.8,b:4.6,y0:FL,y1:2.2,kind:'door',side:-1}],{m:mat.wallExt});
wall(14.2,2.5,14.2,4.5,gT,[],{m:mat.wallExt});
wall(14.2,4.5,14.2,7.9,(x,z)=>Math.max(hr(z),g(z)),[{a:0.15,b:1.25,y0:FL,y1:2.2,kind:'pocket'}]);
wall(14.2,7.9,14.2,10,hrT,[{a:0.4,b:1.7,y0:0.9,y1:2.2,kind:'win',mull:true}],{m:mat.wallExt});
wall(14.2,7.9,17,7.9,(x,z)=>2.75,[],{m:mat.wallExt});

function joyMove(e){const r=joyEl.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),R=44;if(m>R){dx*=R/m;dy*=R/m;}joy.x=dx/R;joy.y=dy/R;knob.style.transform=`translate(${dx}px,${dy}px)`;}

function collide(){const r=0.22;for(let it=0;it<3;it++)for(const c of colliders){if(!c.grp.visible)continue;const cx=Math.max(c.x0,Math.min(st.x,c.x1)),cz=Math.max(c.z0,Math.min(st.z,c.z1));const dx=st.x-cx,dz=st.z-cz,d=Math.hypot(dx,dz);if(d<r){if(d>1e-6){st.x=cx+dx/d*r;st.z=cz+dz/d*r;}else{st.x+=r;}}}
  st.x=Math.max(-3,Math.min(31,st.x));st.z=Math.max(-3,Math.min(13,st.z));}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tweenTo(t){if(reduce){Object.assign(st,t);st.tween=null;return;}let dy=t.yaw-st.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));st.tween={from:{x:st.x,z:st.z,yaw:st.yaw,pitch:st.pitch,eye:st.eye},to:Object.assign({eye:1.6},t,{yaw:st.yaw+dy}),t:0};}

  quintal:{label:'Quintal',x:3.0,z:1.0,yaw:-2.3,pitch:0.08},
  aerea:{label:'Vista aérea'}
};
const viewsRow=document.getElementById('views'),optsRow=document.getElementById('opts');
function markView(k){viewsRow.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===k));}
let roofBtn,e2Btn;
function setRoof(on){roofG.visible=on;if(e2G.visible){}roofBtn&&roofBtn.setAttribute('aria-pressed',on);e2G.children.forEach(ch=>{});roofE2.forEach(m=>m.visible=on);}
const roofE2=e2G.children.filter(ch=>ch.material===mat.tile||ch.material===mat.ceil||(ch.geometry&&ch.geometry.type==='BoxGeometry'&&ch.material===mat.wood));
function setView(k){markView(k);if(k==='aerea'){st.mode='orbit';setRoof(false);st.tween=null;return;}st.mode='walk';setRoof(true);tweenTo(Object.assign({},VIEWS[k]));}
Object.entries(VIEWS).forEach(([k,v])=>{const b=document.createElement('button');b.className='chip';b.textContent=v.label;b.dataset.view=k;b.setAttribute('aria-pressed','false');b.onclick=()=>setView(k);viewsRow.appendChild(b);});
Object.entries(SUNS).forEach(([k,v])=>{const b=document.createElement('button');b.className='chip';b.textContent=v.label;b.dataset.sun=k;b.onclick=()=>setSun(k);optsRow.appendChild(b);});
const lab2=document.createElement('span');lab2.className='lab';lab2.textContent='Mostrar';optsRow.appendChild(lab2);
roofBtn=document.createElement('button');roofBtn.className='chip';roofBtn.textContent='Telhado';roofBtn.onclick=()=>setRoof(!roofG.visible);optsRow.appendChild(roofBtn);
e2Btn=document.createElement('button');e2Btn.className='chip';e2Btn.textContent='2º quarto (Etapa 2)';e2Btn.onclick=()=>{e2G.visible=!e2G.visible;endDoor.visible=!e2G.visible;corrHole();e2Btn.setAttribute('aria-pressed',e2G.visible);roofE2.forEach(m=>m.visible=roofG.visible);};optsRow.appendChild(e2Btn);
// corridor end: when Etapa 2 is on, open the west wall at the corridor
const corrPass={x0:3.1,x1:3.5,z0:8.95,z1:9.95};

e2G.visible=false;endDoor.visible=true;e2Btn.setAttribute('aria-pressed','false');
// west wall of Etapa 1 needs an opening for the corridor door: rebuild that wall with a hole
// keep the corridor-end door solid while Etapa 2 is hidden

setSun('manha');setRoof(true);markView('varanda');

// ---- loop ----
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
let last=performance.now();
function tick(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(st.tween){const tw=st.tween;tw.t+=dt/0.9;const k=tw.t>=1?1:(1-Math.cos(Math.PI*tw.t))/2;['x','z','yaw','pitch','eye'].forEach(p=>st[p]=tw.from[p]+(tw.to[p]-tw.from[p])*k);if(tw.t>=1)st.tween=null;}
  if(st.mode==='walk'){
    let f=0,s=0;if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyD)s+=1;if(keys.KeyA)s-=1;if(keys.ArrowLeft)st.yaw+=dt*1.6;if(keys.ArrowRight)st.yaw-=dt*1.6;
    f-=joy.y;s+=joy.x;
    if(f||s){st.tween=null;if(st.eye<1.5)st.eye=Math.min(1.6,st.eye+dt*2);const sp=(keys.ShiftLeft||keys.ShiftRight?3.2:1.5)*dt;const fx=-Math.sin(st.yaw),fz=-Math.cos(st.yaw),rx=Math.cos(st.yaw),rz=-Math.sin(st.yaw);st.x+=(fx*f+rx*s)*sp;st.z+=(fz*f+rz*s)*sp;collide();}
    const inside=(st.x>3.3&&st.x<17&&st.z>2.3&&st.z<10)||(e2G.visible&&st.x>0.5&&st.x<3.3&&st.z>5&&st.z<10);
    camera.position.set(st.x,(inside?FL:0)+st.eye,st.z);camera.rotation.set(st.pitch,st.yaw,0);
  }else{const o=st.orb,cx=9.5,cz=5.5;camera.position.set(cx+o.r*Math.sin(o.ph)*Math.sin(o.th),o.r*Math.cos(o.ph),cz+o.r*Math.sin(o.ph)*Math.cos(o.th));camera.lookAt(cx,0,cz);}
  const rm=st.mode==='walk'?roomAt(st.x,st.z):null;const name=rm?rm[0]:(st.mode==='orbit'?'Vista aérea':'Lote');
  if(name!==lastRoom){lastRoom=name;roomEl.textContent=name;infoEl.textContent=rm?rm[5]:(st.mode==='orbit'?'Arraste para girar · role para aproximar · use “Telhado” para ver por dentro':'');}
  drawMap(st.mode==='walk'?st.x:(camera.position.x),st.mode==='walk'?st.z:camera.position.z,st.mode==='walk'?st.yaw:Math.atan2(-(9.5-camera.position.x),-(5.5-camera.position.z)));
  renderer.render(scene,camera);requestAnimationFrame(tick);}
document.getElementById('loading').hidden=true;
requestAnimationFrame(tick);
})();
