ont-weight="normal" fill="#2f6b1f" text-anchor="middle" font-family="Helvetica,Arial">vista do quintal deitado na cama</text><line x1="184.0" y1="410.0" x2="184.0" y2="267.5" stroke="#6b4a2b" stroke-width="4"/><circle cx="184.0" cy="233.20000000000002" r="57.2" fill="#8cc46a" fill-opacity="0.85" stroke="#5c8f3f"/><text x="163.2" y="118.8" font-size="9.5" font-weight="normal" fill="#2f6b1f" text-anchor="middle" font-family="Helvetica,Arial">árvore caducifólia ou pergolado c/ uva</text><text x="163.2" y="131.8" font-size="9" font-weight="normal" fill="#2f6b1f" text-anchor="middle" font-family="Helvetica,Arial">(sombra no verão, sol no inverno)</text><line x1="296.8" y1="170.3" x2="300.7" y2="402.2" stroke="#d9534f" stroke-width="1.8" stroke-dasharray="7,4"/><line x1="254.4" y1="170.3" x2="357.7" y2="402.2" stroke="#e09a00" stroke-width="1.8" stroke-dasharray="7,4"/><line x1="192.4" y1="170.3" x2="441.2" y2="402.2" stroke="#e0a800" stroke-width="1.8" stroke-dasharray="7,4"/><text x="163.2" y="163.0" font-size="11" font-weight="bold" fill="#e0a800" text-anchor="end" font-family="Helvetica,Arial">☀ inverno 43°</text><text x="256.8" y="147.4" font-size="11" font-weight="bold" fill="#e09a00" text-anchor="middle" font-family="Helvetica,Arial">☀ equinócio 66°</text><text x="303.6" y="163.0" font-size="11" font-weight="bold" fill="#d9534f" text-anchor="start" font-family="Helvetica,Arial">☀ verão ≈ 89°</text><text x="402.4" y="206.7" font-size="10" font-weight="normal" fill="#a5432a" text-anchor="middle" font-family="Helvetica,Arial">telha cerâmica aparente 30% + manta sob telha</text><text x="464.8" y="263.4" font-size="9.5" font-weight="normal" fill="#8a5f33" text-anchor="middle" font-family="Helvetica,Arial">forro inclinado de madeira + lã de rocha</text><text x="451.8" y="306.0" font-size="12" font-weight="bold" fill="#222" text-anchor="middle" font-family="Helvetica,Arial">QUARTO</text><text x="571.4" y="337.2" font-size="9.5" font-weight="normal" fill="#222" text-anchor="middle" font-family="Helvetica,Arial">corr.</text><text x="615.6" y="163.0" font-size="9.5" font-weight="normal" fill="#c94b4b" text-anchor="end" font-family="Helvetica,Arial">parede alta + rufo</text><text x="615.6" y="176.0" font-size="9" font-weight="normal" fill="#c94b4b" text-anchor="end" font-family="Helvetica,Arial">(sem platibanda/calha)</text><text x="340.0" y="428.2" font-size="9.5" font-weight="normal" fill="#1f78c8" text-anchor="middle" font-family="Helvetica,Arial">porta-janela 2,00 × 2,20 + bandeira</text><text x="319.2" y="262.8" font-size="9.5" font-weight="normal" fill="#6b4a2b" text-anchor="end" font-family="Helvetica,Arial">beiral 0,80</text><text x="353.0" y="259.2" font-size="9.5" font-weight="normal" fill="#555" text-anchor="start" font-family="Helvetica,Arial">2,95</text><text x="628.6" y="181.2" font-size="9.5" font-weight="normal" fill="#555" text-anchor="start" font-family="Helvetica,Arial">4,45</text><text x="650.0" y="100.0" font-size="15" font-weight="bold" fill="#222" text-anchor="start" font-family="Helvetica,Arial">CORTE B – sala + varanda (norte à esquerda)</text><rect x="658.8" y="410" width="572.0000000000002" height="10" fill="#b7a58a"/><polygon points="690.0,410.0 690.0,316.4 697.8,316.4 697.8,410.0" fill="#bbb" stroke="#222" stroke-width="1.5" /><polygon points="809.6,410.0 1210.0,410.0 1210.0,402.2 809.6,402.2" fill="#999" stroke="#222" stroke-width="1" /><polygon points="809.6,403.8 924.0,403.8 924.0,402.2 809.6,402.2" fill="#cdb894" stroke="#222" stroke-width="0.5" /><polygon points="1210.0,410.0 1219.9,410.0 1219.9,178.6 1210.0,178.6" fill="#c94b4b" stroke="#222" stroke-width="1.5" /><polygon points="919.8,286.2 928.2,286.2 928.2,264.4 919.8,264.4" fill="#888" stroke="#222" stroke-width="1.5" /><line x1="921.9" y1="402.2" x2="921.9" y2="287.8" stroke="#1f78c8" stroke-width="2.5"/><line x1="926.1" y1="402.2" x2="926.1" y2="287.8" stroke="#1f78c8" stroke-width="2.5"/><polygon points="809.6,403.8 817.4,403.8 817.4,286.6 809.6