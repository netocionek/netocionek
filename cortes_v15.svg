e="9.5" font-weight="normal" fill="#555" text-anchor="start" font-family="Helvetica,Arial">2,80</text><text x="924.0" y="428.2" font-size="9.5" font-weight="normal" fill="#1f78c8" text-anchor="middle" font-family="Helvetica,Arial">portas de vidro 2,20</text><polygon points="1022.8,402.2 1028.0,402.2 1028.0,365.8 1022.8,365.8" fill="#8a5f33" stroke="#222" stroke-width="0.5" /><line x1="994.2" y1="364.2" x2="1056.6" y2="364.2" stroke="#8a5f33" stroke-width="4"/><line x1="742.0" y1="410.0" x2="742.0" y2="282.1" stroke="#6b4a2b" stroke-width="4"/><circle cx="742.0" cy="254.0" r="46.800000000000004" fill="#8cc46a" fill-opacity="0.85" stroke="#5c8f3f"/><text x="40.0" y="520.0" font-size="15" font-weight="bold" fill="#222" text-anchor="start" font-family="Helvetica,Arial">FACHADA LESTE – vista da Av. Machado de Assis (sul à esquerda, norte à direita)</text><rect x="138.8" y="860" width="582.3999999999999" height="10" fill="#b7a58a"/><polygon points="170.0,860.0 170.0,628.6 279.2,661.4 279.2,860.0" fill="#efe9df" stroke="#777" stroke-width="1" /><line x1="279.2" y1="661.4" x2="164.8" y2="627.0" stroke="#a5432a" stroke-width="7"/><line x1="279.2" y1="665.0" x2="164.8" y2="630.7" stroke="#6b4a2b" stroke-width="2"/><text x="222.0" y="732.6" font-size="9.5" font-weight="normal" fill="#666" text-anchor="middle" font-family="Helvetica,Arial">sala (recuada 2,80 m)</text><line x1="258.4" y1="813.2" x2="190.8" y2="813.2" stroke="#1f78c8" stroke-width="3"/><line x1="258.4" y1="745.6" x2="190.8" y2="745.6" stroke="#1f78c8" stroke-width="3"/><line x1="258.4" y1="813.2" x2="258.4" y2="745.6" stroke="#1f78c8" stroke-width="3"/><line x1="190.8" y1="813.2" x2="190.8" y2="745.6" stroke="#1f78c8" stroke-width="3"/><polygon points="279.2,860.0 279.2,717.0 419.6,674.9 560.0,717.0 560.0,860.0" fill="#f3ece0" stroke="#333" stroke-width="2" /><polygon points="279.2,860.0 279.2,808.0 560.0,808.0 560.0,860.0" fill="url(#br)" stroke="#333" stroke-width="1" /><polygon points="398.8,714.4 440.4,714.4 440.4,693.6 398.8,693.6" fill="url(#wd)" stroke="#6b4a2b" stroke-width="1" /><line x1="248.0" y1="726.4" x2="419.6" y2="669.7" stroke="#a5432a" stroke-width="7"/><line x1="248.0" y1="730.0" x2="419.6" y2="673.3" stroke="#6b4a2b" stroke-width="2"/><line x1="419.6" y1="669.7" x2="591.2" y2="726.4" stroke="#a5432a" stroke-width="7"/><line x1="419.6" y1="673.3" x2="591.2" y2="730.0" stroke="#6b4a2b" stroke-width="2"/><polygon points="450.8,802.8 528.8,802.8 528.8,745.6 450.8,745.6" fill="#d7ecfa" stroke="#1f78c8" stroke-width="2.5" /><line x1="489.8" y1="802.8" x2="489.8" y2="745.6" stroke="#1f78c8" stroke-width="1.5"/><polygon points="320.8,860.0 362.4,860.0 362.4,750.8 320.8,750.8" fill="url(#wd)" stroke="#6b4a2b" stroke-width="1.5" /><text x="419.6" y="878.2" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" font-family="Helvetica,Arial">cozinha</text><text x="341.6" y="878.2" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" font-family="Helvetica,Arial">serviço</text><text x="326.0" y="795.0" font-size="1" font-weight="normal" fill="#222" text-anchor="middle" font-family="Helvetica,Arial"></text><line x1="643.2" y1="860.0" x2="643.2" y2="710.2" stroke="#6b4a2b" stroke-width="4"/><circle cx="643.2" cy="672.8" r="62.4" fill="#7fb85c" fill-opacity="0.85" stroke="#5c8f3f"/><text x="643.2" y="594.8" font-size="10" font-weight="normal" fill="#2f6b1f" text-anchor="middle" font-family="Helvetica,Arial">jardim frontal</text><text x="419.6" y="651.5" font-size="10.5" font-weight="bold" fill="#a5432a" text-anchor="middle" font-family="Helvetica,Arial">oitão voltado para a rua · telha cerâmica aparente, beiral 0,60</text><text x="419.6" y="836.6" font-size="9.5" font-weight="normal" fill="#fff" text-anchor="middle" font-family="Helvetica,Arial">rodapé em tijolinho aparente</text><text x="175.2" y="613.0" font-size="9.5" font-weight="normal" fill="#c94b4b" text-anchor="start" font-family="Helvetica,Arial">parede alta do sul (divisa) + rufo</text><text x="326.0" y="901.6" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" font-family="Helvetica,Arial">garagem descoberta à frente · portão de correr em madeira ripada</text><text x="40.0" y="955.0" font-size="13" font-weight="bold" fill="#222" text-anchor="start" font-family="Helvetica,Arial">Por que a janela grande ao norte NÃO esquenta o quarto:</text><text x="40.0" y="976.0" font-size="12" font-weight="normal" fill="#222" text-anchor="start" font-family="Helvetica,Arial">• Em Goioerê (24°S), no verão o sol do meio-dia passa quase a pino: o beiral de 0,80 m faz sombra na porta-janela inteira.</text><text x="40.0" y="997.0" font-size="12" font-weight="normal" fill="#222" text-anchor="start" font-family="Helvetica,Arial">• No inverno o sol vem baixo pelo norte e entra ~1,9 m no quarto — aquece de graça. Leste e oeste (sol baixo e quente) não têm janelas de quarto.</text><text x="40.0" y="1018.0" font-size="12" font-weight="normal" fill="#222" text-anchor="start" font-family="Helvetica,Arial">• Venezianas de correr (madeira ou alumínio) + vidro: ventila com privacidade e escurece para dormir. Bandeira alta + claraboia no corredor tiram o ar quente (efeito chaminé).</text><text x="40.0" y="1039.0" font-size="12" font-weight="normal" fill="#222" text-anchor="start" font-family="Helvetica,Arial">• Vidro laminado nas portas-janela (segurança, NBR 7199). Alturas e inclinações a confirmar pelo responsável técnico.</text></svg>